name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip FamilyInventory300_Android_Project.zip -d project
          find project -name gradlew -type f -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew -type f | head -1)
          cd $(dirname $(find project -name gradlew -type f | head -1))
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyInventory300-APK
          path: project/**/build/outputs/apk/debug/*.apk
